<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gailan widget screenshot</title>
    <!--
      A desktop for a widget to be photographed on. A widget on its own says
      nothing about where it lives, so a screenshot puts it back: menu bar above,
      dock below, wallpaper behind.

      Nothing here is Apple's artwork. The wallpaper is whatever you point the
      script at and is never committed, the dock holds shapes rather than app
      icons, and the menu bar is drawn.

      Sizes are in CSS pixels. Capture at 2x for a preview that holds up.
    -->
    <style>
      :root {
        --bar-height: 25px;
        --dock-height: 64px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, "SF Pro Text", "Helvetica Neue", Inter, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* the frame is exactly what gets captured */
      #desktop {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #4a6f8a;
      }

      #wallpaper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* stands in until a wallpaper is supplied, so the page is never bare */
        background: linear-gradient(160deg, #b9d7e8 0%, #7fa8c4 45%, #d8b48a 100%);
      }

      /* ---------- the menu bar ---------- */

      #bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: var(--bar-height);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 12px;
        font-size: 13px;
        color: #fff;
        background: rgba(30, 34, 40, 0.28);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.25);
      }

      #bar .logo {
        display: block;
        width: 14px;
        height: 16px;
        margin-right: -4px;
        opacity: 0.95;
      }

      #bar .app {
        font-weight: 600;
      }

      #bar .menus {
        display: flex;
        gap: 18px;
        opacity: 0.95;
      }

      #bar .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      #bar .right svg {
        display: block;
        opacity: 0.95;
      }

      #bar .clock {
        font-variant-numeric: tabular-nums;
      }

      /* ---------- the dock ---------- */

      #dock {
        position: absolute;
        left: 50%;
        bottom: 6px;
        transform: translateX(-50%);
        height: var(--dock-height);
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 10px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.24);
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: saturate(180%) blur(24px);
        -webkit-backdrop-filter: saturate(180%) blur(24px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      }

      #dock .app-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          0 1px 3px rgba(0, 0, 0, 0.25);
      }

      #dock .divider {
        width: 1px;
        height: 44px;
        margin: 0 3px;
        background: rgba(255, 255, 255, 0.4);
      }

      /* a widget sits where a widget sits: on the desktop, under the bar. The slot
         takes the widget's size rather than the width of the screen, so placement
         and scaling both have something real to work from. */
      .slot {
        position: absolute;
        top: 60px;
        right: 70px;
        width: fit-content;
        height: fit-content;
      }

      .slot.left {
        right: auto;
        left: 70px;
      }

      .slot.centre {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div id="desktop">
      <img id="wallpaper" alt="" />

      <div id="bar">
        <svg class="logo" viewBox="0 0 14 17" fill="currentColor" aria-hidden="true">
          <path
            d="M11.7 9c0-1.6 1-2.5 1.1-2.6-.6-.9-1.5-1-1.8-1-.9-.1-1.7.5-2.1.5-.4 0-1.1-.5-1.9-.5-1 0-1.9.6-2.4 1.5-1 1.8-.3 4.4.7 5.9.5.7 1.1 1.5 1.9 1.5.7 0 1-.5 1.9-.5.9 0 1.1.5 1.9.5.8 0 1.3-.7 1.8-1.5.6-.9.8-1.7.8-1.8 0 0-1.6-.6-1.6-2.4zM9.6 4.2c.4-.5.7-1.2.6-1.9-.6 0-1.4.4-1.8.9-.4.5-.7 1.2-.6 1.8.7.1 1.4-.3 1.8-.8z"
          />
        </svg>
        <span class="app" id="app-name">Finder</span>
        <div class="menus">
          <span>File</span>
          <span>Edit</span>
          <span>View</span>
          <span>Go</span>
          <span>Window</span>
          <span>Help</span>
        </div>

        <div class="right">
          <!-- control centre -->
          <svg width="15" height="13" viewBox="0 0 15 13" fill="none" aria-hidden="true">
            <rect x="0.6" y="0.6" width="13.8" height="4.3" rx="2.15" stroke="#fff" stroke-width="1.1"/>
            <circle cx="10.2" cy="2.75" r="1.3" fill="#fff"/>
            <rect x="0.6" y="7.9" width="13.8" height="4.3" rx="2.15" stroke="#fff" stroke-width="1.1"/>
            <circle cx="4.8" cy="10.05" r="1.3" fill="#fff"/>
          </svg>
          <!-- wifi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
            <path d="M1 4.1a10.5 10.5 0 0 1 14 0" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M3.6 6.7a6.8 6.8 0 0 1 8.8 0" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="8" cy="10" r="1.5" fill="#fff"/>
          </svg>
          <!-- battery -->
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none" aria-hidden="true">
            <rect x="0.7" y="0.7" width="22" height="11.6" rx="3" stroke="#fff" stroke-width="1.1" opacity="0.85"/>
            <rect x="2.4" y="2.4" width="15" height="8.2" rx="1.8" fill="#fff"/>
            <path d="M24.4 4.6v3.8a2 2 0 0 0 0-3.8z" fill="#fff" opacity="0.85"/>
          </svg>
          <span class="clock" id="clock">Thu 27 Aug 09:41</span>
        </div>
      </div>

      <!-- widgets are added here, one slot each -->

      <div id="dock">
        <div class="app-icon" style="background: linear-gradient(160deg,#7fd0ff,#1d7fd6)"></div>
        <div class="app-icon" style="background: linear-gradient(160deg,#fff2b0,#f5a623)"></div>
        <div class="app-icon" style="background: linear-gradient(160deg,#b6f0c4,#2fa85b)"></div>
        <div class="app-icon" style="background: linear-gradient(160deg,#ffc2d1,#e8437a)"></div>
        <div class="app-icon" style="background: linear-gradient(160deg,#d9c7ff,#7b52d3)"></div>
        <div class="app-icon" style="background: linear-gradient(160deg,#cfd6dd,#7b8794)"></div>
        <div class="divider"></div>
        <div class="app-icon" style="background: linear-gradient(160deg,#e8edf2,#b6c0ca)"></div>
      </div>
    </div>

    <script src="host.bundle.js"></script>
    <script>
      // everything the page needs is in the query, so one template serves any widget
      const query = new URLSearchParams(location.search);
      const wallpaper = query.get("wallpaper") || "wallpaper.jpg";
      const position = query.get("position");
      const fill = query.get("fill") === "1";
      const arrange = query.get("arrange") || "";
      const zoom = Number(query.get("zoom") || "1") || 1;

      // clear of the menu bar, clear of the dock, and the same gap between each
      const BAR = 25;
      const DOCK = 82;
      const INSET = 34;
      const GAP = 26;
      const app = query.get("app");
      const clock = query.get("clock");

      if (app) document.getElementById("app-name").textContent = app;
      if (clock) document.getElementById("clock").textContent = clock;

      // a missing wallpaper leaves the gradient underneath rather than a broken image
      const image = document.getElementById("wallpaper");
      image.addEventListener("error", () => image.removeAttribute("src"));
      image.src = wallpaper;

      let mounted = [];
      try {
        mounted = JSON.parse(query.get("widgets") || "[]");
      } catch (err) {
        console.warn("the widget list was not readable json");
      }

      const desktop = document.getElementById("desktop");
      const slots = [];

      // one bundle per widget, named for it, loaded before anything is mounted
      function load(src) {
        return new Promise((resolve, reject) => {
          const tag = document.createElement("script");
          tag.src = src;
          tag.onload = resolve;
          tag.onerror = () => reject(new Error("could not load " + src));
          document.head.appendChild(tag);
        });
      }

      Promise.all(mounted.map((entry) => load(entry.id + ".js")))
        .catch((err) => console.warn(err.message))
        .then(place);

      function place() {
      const registry = globalThis.__gailanWidgets || {};

      mounted.forEach((entry) => {
        const widget = registry[entry.id];
        const slot = document.createElement("div");
        slot.className = "slot" + (position ? " " + position : "");
        // a widget declares where it sits, the same declarations Gailan applies
        if (!position && entry.placement) {
          slot.style.cssText =
            "position: absolute; width: fit-content; height: fit-content;" +
            entry.placement;
        }
        // the dock is at the bottom, so widgets are inserted above it
        desktop.insertBefore(slot, document.getElementById("dock"));
        slots.push(slot);

        if (!widget) {
          slot.textContent = "no bundle for " + entry.id;
          return;
        }

        const Component = widget.render
          ? (props) => widget.render(props)
          : widget;

        window.__mount(
          window.React.createElement(Component, {
            output: entry.output || "",
            settings: entry.settings || {},
          }),
          slot
        );
      });

      // Several widgets read as a desktop, and a desktop wants them tidy: down the
      // right, the same distance apart, clear of the bar above and the dock below.
      // Measuring first is what makes the gaps even when the panels differ in
      // height, and scaling by transform keeps that arithmetic in one place.
      if (arrange === "right" && slots.length) {
        setTimeout(() => {
          let top = BAR + INSET;

          slots.forEach((slot) => {
            const drawn = slot.firstElementChild || slot;
            const box = drawn.getBoundingClientRect();

            slot.style.cssText =
              "position: absolute;" +
              "width: fit-content; height: fit-content;" +
              "right: " + INSET + "px;" +
              "top: " + Math.round(top) + "px;" +
              "transform: scale(" + zoom + ");" +
              "transform-origin: top right;";

            top += box.height * zoom + GAP;
          });

          const overflow = top - GAP - (desktop.clientHeight - DOCK);
          if (overflow > 0) {
            console.warn("the column is " + Math.round(overflow) + "px too tall");
          }
        }, 700);
      }

      // A lone widget is a portrait of that widget, so it is scaled up until it
      // nearly fills the frame. Waiting a beat lets it render first: there is
      // nothing to measure before that.
      if (fill && slots.length === 1) {
        setTimeout(() => {
          const slot = slots[0];
          // the widget itself, not the slot holding it
          const drawn = slot.firstElementChild || slot;
          const box = drawn.getBoundingClientRect();
          if (!box.width || !box.height) return;

          const room = {
            width: desktop.clientWidth * 0.78,
            height: (desktop.clientHeight - BAR - DOCK) * 0.86,
          };
          const scale = Math.min(room.width / box.width, room.height / box.height);
          if (scale <= 1) return;

          slot.style.cssText =
            "position: absolute;" +
            "width: fit-content; height: fit-content;" +
            "left: 50%;" +
            "top: " + (BAR + (desktop.clientHeight - BAR - DOCK) / 2) + "px;" +
            "transform: translate(-50%, -50%) scale(" + scale.toFixed(3) + ");";
        }, 700);
      }
      }
    </script>
  </body>
</html>
